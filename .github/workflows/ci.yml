name: JDV Savoir+ CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/sync-ui-polish-2026-10-31]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
